# Either Vercel or Netlify is acceptable (docs/02-tech-stack.md). Both configs are
# committed so the team can pick one at deploy time without editing the repo.

[build]
  base    = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Single-page app: every route resolves to index.html.
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
